<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Cheatsheet | MockMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcf8f2;
            font-family: 'Patrick Hand', cursive;
            margin: 0;
            padding: 20px;
        }
        .notebook-container {
            max-width: 1000px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.95);
            border-left: 45px solid #f9dad6;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            position: relative;
        }
        .notebook-container::before {
            content: ''; position: absolute; top: 0; left: 12px; bottom: 0; width: 2px; background: #f2a6a6; opacity: 0.5;
        }
        .back-btn {
            position: absolute; top: 25px; left: 15px; background: #b8a1ff; color: white; border: none;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; font-size: 1rem;
        }
        .page-title {
            text-align: center; font-family: 'Caveat', cursive; font-size: 3.5rem; color: #2d3748; margin: 0 0 10px 0;
        }
        .subtitle {
            text-align: center; color: #718096; font-size: 1.2rem; margin-bottom: 30px;
        }
        .cheatsheet-wrapper {
            width: 100%;
            text-align: center;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            background: #fff;
            padding: 10px;
            box-sizing: border-box;
        }
        .cheatsheet-img {
            width: 100%;
            height: auto;
            display: block;
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }
        .cheatsheet-img:active {
            transform: scale(1.5);
            cursor: zoom-out;
        }
    </style>
</head>
<body>
    <div class="notebook-container">
        <a href="/python_hub" class="back-btn">← Back</a>
        <h1 class="page-title">🐍 Python Master Cheatsheet</h1>
        
        <div class="cheatsheet-wrapper">
            <img src="{{ url_for('static', filename='images/cheatsheets/Python_Cheatshheet.jpg') }}" alt="Python Cheatsheet" class="cheatsheet-img">
        </div>
    </div>
</body>
</html>
